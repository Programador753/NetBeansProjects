<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Editar Meta ODS: #{metaodsController.selected.nomMetaEsp}</ui:define>
        <ui:define name="body">
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            <h:form>
                <p:panel header=" Datos de la Meta ODS">
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Código Meta:"/>
                        <p:inputText value="#{metaodsController.selected.codMeta}" disabled="true"/>
                        <p:outputLabel value="ODS Principal:"/>
                        <h:selectOneMenu value="#{metaodsController.selected.codOds}">
                            <f:selectItem itemLabel="-- Seleccione ODS --" itemValue=""/>
                            <f:selectItems value="#{odsprincipalController.itemsAvailableSelectOne}"/>
                        </h:selectOneMenu>
                        <p:outputLabel value="Nombre (Español): *"/>
                        <p:inputText value="#{metaodsController.selected.nomMetaEsp}" required="true" size="60" style="width:400px;"/>
                        <p:outputLabel value="Nombre (Inglés):"/>
                        <p:inputText value="#{metaodsController.selected.nomMetaIng}" size="60" style="width:400px;"/>
                        <p:outputLabel value="Descripción:"/>
                        <p:inputTextarea value="#{metaodsController.selected.descripcion}" rows="3" cols="50"/>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Guardar" action="#{metaodsController.update}" icon="pi pi-save"/>
                <p:commandButton value=" Volver" action="#{metaodsController.prepareList}" immediate="true"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
