<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Editar Donación</ui:define>
        <ui:define name="body">
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            <h:form>
                <p:panel header=" Datos de la Donación">
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Código:"/>
                        <p:inputText value="#{donacionController.selected.codDonacion}" disabled="true"/>
                        <p:outputLabel value="Donante:"/>
                        <h:selectOneMenu value="#{donacionController.selected.codDonante}">
                            <f:selectItem itemLabel="-- Seleccione Donante --" itemValue=""/>
                            <f:selectItems value="#{donanteController.itemsAvailableSelectOne}"/>
                        </h:selectOneMenu>
                        <p:outputLabel value="Proyecto:"/>
                        <h:selectOneMenu value="#{donacionController.selected.codProyecto}">
                            <f:selectItem itemLabel="-- Seleccione Proyecto --" itemValue=""/>
                            <f:selectItems value="#{proyectoController.itemsAvailableSelectOne}"/>
                        </h:selectOneMenu>
                        <p:outputLabel value="Cantidad (€): *"/>
                        <p:inputText value="#{donacionController.selected.cantidad}" required="true" size="15">
                            <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                        </p:inputText>
                        <p:outputLabel value="Fecha Donación:"/>
                        <p:calendar value="#{donacionController.selected.fechaDonacion}" pattern="dd/MM/yyyy" showOn="button"/>
                        <p:outputLabel value="Comentario:"/>
                        <p:inputTextarea value="#{donacionController.selected.comentario}" rows="3" cols="50"/>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Guardar" action="#{donacionController.update}" icon="pi pi-save"/>
                <p:commandButton value=" Volver" action="#{donacionController.prepareList}" immediate="true"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
