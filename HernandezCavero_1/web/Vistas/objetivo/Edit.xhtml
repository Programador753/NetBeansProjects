<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Editar Objetivo</ui:define>
        <ui:define name="body">
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            <h:form>
                <p:panel header=" Datos del Objetivo">
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Código:"/>
                        <p:inputText value="#{objetivoController.selected.codObjetivo}" disabled="true"/>
                        <p:outputLabel value="Proyecto:"/>
                        <h:selectOneMenu value="#{objetivoController.selected.codProyecto}">
                            <f:selectItem itemLabel="-- Seleccione Proyecto --" itemValue=""/>
                            <f:selectItems value="#{proyectoController.itemsAvailableSelectOne}"/>
                        </h:selectOneMenu>
                        <p:outputLabel value="Tipo Objetivo:"/>
                        <p:selectOneMenu value="#{objetivoController.selected.tipo}">
                            <f:selectItem itemLabel="-- Seleccione --" itemValue=""/>
                            <f:selectItem itemLabel="General" itemValue="G"/>
                            <f:selectItem itemLabel="Específico" itemValue="E"/>
                        </p:selectOneMenu>
                        <p:outputLabel value="Descripción: *"/>
                        <p:inputTextarea value="#{objetivoController.selected.descripcion}" required="true" rows="4" cols="60" style="width:400px;"/>
                        <p:outputLabel value="Indicador:"/>
                        <p:inputTextarea value="#{objetivoController.selected.indicador}" rows="3" cols="60" style="width:400px;"/>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Guardar" action="#{objetivoController.update}" icon="pi pi-save"/>
                <p:commandButton value=" Volver" action="#{objetivoController.prepareList}" immediate="true"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
