<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListSedeTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <p:dataTable value="#{sedeController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">

                    <p:column headerText="#{bundle.ListSedeTitle_codSede}" sortBy="#{item.codSede}" filterBy="#{item.codSede}" filterMatchMode="contains">
                        <h:outputText value="#{item.codSede}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListSedeTitle_nomSede}" sortBy="#{item.nomSede}" filterBy="#{item.nomSede}" filterMatchMode="contains">
                        <h:outputText value="#{item.nomSede}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListSedeTitle_direccion}" sortBy="#{item.direccion}" filterBy="#{item.direccion}" filterMatchMode="contains">
                        <h:outputText value="#{item.direccion}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListSedeTitle_ciudad}" sortBy="#{item.ciudad}" filterBy="#{item.ciudad}" filterMatchMode="contains">
                        <h:outputText value="#{item.ciudad}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListSedeTitle_telefono}" sortBy="#{item.telefono}" filterBy="#{item.telefono}" filterMatchMode="contains">
                        <h:outputText value="#{item.telefono}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListSedeTitle_pais}" sortBy="#{item.pais}" filterBy="#{item.pais}" filterMatchMode="contains">
                        <h:outputText value="#{item.pais}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListSedeTitle_socioLocal}" sortBy="#{item.socioLocal}" filterBy="#{item.socioLocal}" filterMatchMode="contains">
                        <h:outputText value="#{item.socioLocal}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListSedeTitle_codInspectoria}" sortBy="#{item.codInspectoria}" filterBy="#{item.codInspectoria}" filterMatchMode="contains">
                        <h:outputText value="#{item.codInspectoria}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="&nbsp;"/>
                        </f:facet>
                        <h:commandLink action="#{sedeController.prepareView}" value="#{bundle.ListSedeViewLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{sedeController.prepareEdit}" value="#{bundle.ListSedeEditLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{sedeController.destroy}" value="#{bundle.ListSedeDestroyLink}"/>
                    </p:column>
                </p:dataTable>
                <br />
                <h:commandLink action="#{sedeController.prepareCreate}" value="#{bundle.ListSedeCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListSedeIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
