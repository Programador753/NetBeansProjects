<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value=" Detalle Sede: #{sedeController.selected.nomSede}"/>
        </ui:define>
        <ui:define name="body">
            <h:form>
                <p:panel header=" Información de la Sede">
                    <h:panelGrid columns="4" cellpadding="10" style="width:100%;">
                        
                        <h:outputText value="Código:" style="font-weight:bold;"/>
                        <h:outputText value="#{sedeController.selected.codSede}" style="font-size:1.2em; color:#1a237e;"/>
                        
                        <h:outputText value="Inspectoría:" style="font-weight:bold;"/>
                        <h:outputText value="#{sedeController.selected.codInspectoria.codInspectoria}" 
                                      rendered="#{sedeController.selected.codInspectoria ne null}"/>
                        
                        <h:outputText value="Nombre:" style="font-weight:bold;"/>
                        <h:outputText value="#{sedeController.selected.nomSede}" style="grid-column: span 3;"/>
                        
                        <h:outputText value="Socio Local:" style="font-weight:bold;"/>
                        <h:outputText value="#{sedeController.selected.socioLocal}"/>
                        
                        <h:outputText value="Ciudad:" style="font-weight:bold;"/>
                        <h:outputText value="#{sedeController.selected.ciudad}"/>
                        
                        <h:outputText value="País:" style="font-weight:bold;"/>
                        <h:outputText value="#{sedeController.selected.pais}"/>
                        
                        <h:outputText value="Teléfono:" style="font-weight:bold;"/>
                        <h:outputText value="#{sedeController.selected.telefono}"/>
                        
                        <h:outputText value="Dirección:" style="font-weight:bold;"/>
                        <h:outputText value="#{sedeController.selected.direccion}" style="grid-column: span 3;"/>
                        
                    </h:panelGrid>
                </p:panel>
                
                <p:panel header=" Proyectos en esta Sede" style="margin-top:15px;">
                    <p:dataTable value="#{sedeController.selected.proyectoList}" var="proyecto"
                                 emptyMessage="No hay proyectos registrados para esta sede"
                                 rendered="#{not empty sedeController.selected.proyectoList}"
                                 rows="5" paginator="true">
                        <p:column headerText="Código" width="120">
                            <h:outputText value="#{proyecto.codigo}"/>
                        </p:column>
                        <p:column headerText="Título">
                            <h:outputText value="#{proyecto.titulo}"/>
                        </p:column>
                        <p:column headerText="Año" width="60">
                            <h:outputText value="#{proyecto.anyo}"/>
                        </p:column>
                        <p:column headerText="Dinero Concedido" width="130" style="text-align:right">
                            <h:outputText value="#{proyecto.dineroConcedido}">
                                <f:convertNumber type="currency" currencySymbol="€"/>
                            </h:outputText>
                        </p:column>
                    </p:dataTable>
                    <h:outputText value="No hay proyectos registrados" 
                                  rendered="#{empty sedeController.selected.proyectoList}" style="color:#999;"/>
                </p:panel>
                
                <br/>
                <h:panelGroup style="display:flex; gap:10px;">
                    <p:commandButton value=" Editar" action="#{sedeController.prepareEdit}" 
                                     icon="pi pi-pencil" styleClass="ui-button-warning"/>
                    <p:commandButton value=" Eliminar" action="#{sedeController.destroy}" 
                                     icon="pi pi-trash" styleClass="ui-button-danger"
                                     onclick="return confirm('¿Está seguro de eliminar esta sede?');"/>
                    <p:commandButton value=" Volver al Listado" action="#{sedeController.prepareList}" 
                                     icon="pi pi-arrow-left" styleClass="ui-button-secondary"/>
                </h:panelGroup>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
