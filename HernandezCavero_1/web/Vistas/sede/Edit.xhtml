<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="Editar Sede: #{sedeController.selected.nomSede}"/>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <p:panel header="Datos de la Sede">
                    <h:panelGrid columns="2" cellpadding="10" style="width:100%;">
                        
                        <p:outputLabel value="Codigo Sede:"/>
                        <p:inputText value="#{sedeController.selected.codSede}" disabled="true"/>
                        
                        <p:outputLabel value="Nombre Sede: *"/>
                        <p:inputText value="#{sedeController.selected.nomSede}" 
                                     required="true" size="60" style="width:400px;"/>
                        
                        <p:outputLabel value="Inspectoria:"/>
                        <h:selectOneMenu value="#{sedeController.selected.codInspectoria}">
                            <f:selectItem itemLabel="-- Seleccione Inspectoria --" itemValue=""/>
                            <f:selectItems value="#{inspectoriaController.itemsAvailableSelectOne}"/>
                        </h:selectOneMenu>
                        
                        <p:outputLabel value="Socio Local:"/>
                        <p:selectOneMenu value="#{sedeController.selected.socioLocal}">
                            <f:selectItem itemLabel="-- Seleccione --" itemValue=""/>
                            <f:selectItem itemLabel="SDB - Salesiano" itemValue="SDB"/>
                            <f:selectItem itemLabel="FMA - Hija de Maria Auxiliadora" itemValue="FMA"/>
                            <f:selectItem itemLabel="HDS - Hermana de Don Bosco" itemValue="HDS"/>
                        </p:selectOneMenu>
                        
                        <p:outputLabel value="Direccion:"/>
                        <p:inputText value="#{sedeController.selected.direccion}" size="60" style="width:400px;"/>
                        
                        <p:outputLabel value="Ciudad:"/>
                        <p:inputText value="#{sedeController.selected.ciudad}" size="30"/>
                        
                        <p:outputLabel value="Pais:"/>
                        <p:inputText value="#{sedeController.selected.pais}" size="4" maxlength="2"/>
                        
                        <p:outputLabel value="Telefono:"/>
                        <p:inputText value="#{sedeController.selected.telefono}" size="20"/>
                        
                    </h:panelGrid>
                </p:panel>
                
                <br/>
                <h:panelGroup style="display:flex; gap:10px;">
                    <p:commandButton value="Guardar Cambios" action="#{sedeController.update}" 
                                     icon="pi pi-save" styleClass="ui-button-success"/>
                    <p:commandButton value="Ver Detalle" action="#{sedeController.prepareView}" 
                                     icon="pi pi-eye" styleClass="ui-button-info"/>
                    <p:commandButton value="Volver al Listado" action="#{sedeController.prepareList}" 
                                     icon="pi pi-arrow-left" styleClass="ui-button-secondary" immediate="true"/>
                </h:panelGroup>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
