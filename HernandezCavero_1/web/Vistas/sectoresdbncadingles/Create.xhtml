<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Nuevo Sector DBN CAD Inglés</ui:define>
        <ui:define name="body">
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            <h:form>
                <p:panel header=" Sector DBN CAD Inglés">
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Código: *" for="codSectorDbncadIngles"/>
                        <p:inputText id="codSectorDbncadIngles" value="#{sectoresdbncadinglesController.selected.codSectorDbncadIngles}" required="true" size="10"/>
                        <p:outputLabel value="Nombre (Inglés): *" for="nomSectorDbncadIngles"/>
                        <p:inputText id="nomSectorDbncadIngles" value="#{sectoresdbncadinglesController.selected.nomSectorDbncadIngles}" required="true" size="80" style="width:500px;"/>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Guardar" action="#{sectoresdbncadinglesController.create}" icon="pi pi-save"/>
                <p:commandButton value=" Volver" action="#{sectoresdbncadinglesController.prepareList}" immediate="true"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
