<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListInstrumentoTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <p:dataTable value="#{instrumentoController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">

                    <p:column headerText="#{bundle.ListInstrumentoTitle_lt}" sortBy="#{item['lt']}" filterBy="#{item['lt']}" filterMatchMode="contains">
                        <h:outputText value="#{item['lt']}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListInstrumentoTitle_codigo}" sortBy="#{item.codigo}" filterBy="#{item.codigo}" filterMatchMode="contains">
                        <h:outputText value="#{item.codigo}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListInstrumentoTitle_descripcion}" sortBy="#{item.descripcion}" filterBy="#{item.descripcion}" filterMatchMode="contains">
                        <h:outputText value="#{item.descripcion}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListInstrumentoTitle_numero}" sortBy="#{item.numero}" filterBy="#{item.numero}" filterMatchMode="contains">
                        <h:outputText value="#{item.numero}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListInstrumentoTitle_bloque}" sortBy="#{item.bloque}" filterBy="#{item.bloque}" filterMatchMode="contains">
                        <h:outputText value="#{item.bloque}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="&nbsp;"/>
                        </f:facet>
                        <h:commandLink action="#{instrumentoController.prepareView}" value="#{bundle.ListInstrumentoViewLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{instrumentoController.prepareEdit}" value="#{bundle.ListInstrumentoEditLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{instrumentoController.destroy}" value="#{bundle.ListInstrumentoDestroyLink}"/>
                    </p:column>
                </p:dataTable>
                <br />
                <h:commandLink action="#{instrumentoController.prepareCreate}" value="#{bundle.ListInstrumentoCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListInstrumentoIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
