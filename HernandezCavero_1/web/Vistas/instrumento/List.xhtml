<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="Instrumentos de Financiacion"/>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                
                <p:dataTable value="#{instrumentoController.items}" var="item" 
                             rows="10" 
                             paginator="true" 
                             paginatorPosition="both"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
                             currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} instrumentos"
                             emptyMessage="No hay instrumentos registrados"
                             tableStyle="table-layout:auto"
                             style="margin-top:20px;">
                    
                    <!-- LT -->
                    <p:column headerText="LT" style="text-align:center; width:50px;">
                        <h:outputText value="#{item['lt']}" style="font-weight:bold; color:#1a237e;"/>
                    </p:column>
                    
                    <!-- Codigo -->
                    <p:column headerText="Codigo" sortBy="#{item.codigo}" style="width:100px;">
                        <h:outputText value="#{item.codigo}"/>
                    </p:column>
                    
                    <!-- Descripcion -->
                    <p:column headerText="Descripcion" sortBy="#{item.descripcion}">
                        <h:outputText value="#{item.descripcion}"/>
                    </p:column>
                    
                    <!-- Numero -->
                    <p:column headerText="Num." sortBy="#{item.numero}" style="text-align:center; width:50px;">
                        <h:outputText value="#{item.numero}"/>
                    </p:column>
                    
                    <!-- Bloque -->
                    <p:column headerText="Bloque" sortBy="#{item.bloque}" style="text-align:center; width:50px;">
                        <h:outputText value="#{item.bloque}"/>
                    </p:column>
                    
                    <!-- Acciones -->
                    <p:column headerText="Acciones" style="text-align:center; width:120px;" exportable="false">
                        <h:commandLink action="#{instrumentoController.prepareView}" value="Ver" 
                                       title="Ver detalles" style="margin-right:5px;"/>
                        <h:commandLink action="#{instrumentoController.prepareEdit}" value="Editar" 
                                       title="Editar instrumento" style="margin-right:5px;"/>
                        <h:commandLink action="#{instrumentoController.destroy}" value="X" 
                                       title="Eliminar instrumento" style="color:red;"
                                       onclick="return confirm('Esta seguro de eliminar este instrumento?');"/>
                    </p:column>
                    
                </p:dataTable>
                
                <br />
                <p:commandButton value="Nuevo Instrumento" action="#{instrumentoController.prepareCreate}" 
                                 icon="pi pi-plus" styleClass="ui-button-success"/>
                <br /><br />
                <h:link outcome="/index" value="Volver al Inicio"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
