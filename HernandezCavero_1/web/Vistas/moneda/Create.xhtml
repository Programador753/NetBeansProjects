<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Nueva Moneda</ui:define>
        <ui:define name="body">
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            <h:form>
                <p:panel header="💱 Datos de la Moneda">
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Código ISO: *"/>
                        <p:inputText value="#{monedaController.selected.codMoneda}" required="true" size="5" maxlength="3"/>
                        <p:outputLabel value="Nombre: *"/>
                        <p:inputText value="#{monedaController.selected.nomMoneda}" required="true" size="50" style="width:300px;"/>
                        <p:outputLabel value="Símbolo:"/>
                        <p:inputText value="#{monedaController.selected.simbolo}" size="5"/>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Guardar" action="#{monedaController.create}" icon="pi pi-save"/>
                <p:commandButton value=" Volver" action="#{monedaController.prepareList}" immediate="true"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
