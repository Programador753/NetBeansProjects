<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListSociolocalTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <p:dataTable value="#{sociolocalController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">

                    <p:column headerText="#{bundle.ListSociolocalTitle_codSocio}" sortBy="#{item.codSocio}" filterBy="#{item.codSocio}" filterMatchMode="contains">
                        <h:outputText value="#{item.codSocio}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListSociolocalTitle_nomSocio}" sortBy="#{item.nomSocio}" filterBy="#{item.nomSocio}" filterMatchMode="contains">
                        <h:outputText value="#{item.nomSocio}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListSociolocalTitle_orden}" sortBy="#{item.orden}" filterBy="#{item.orden}" filterMatchMode="contains">
                        <h:outputText value="#{item.orden}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="&nbsp;"/>
                        </f:facet>
                        <h:commandLink action="#{sociolocalController.prepareView}" value="#{bundle.ListSociolocalViewLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{sociolocalController.prepareEdit}" value="#{bundle.ListSociolocalEditLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{sociolocalController.destroy}" value="#{bundle.ListSociolocalDestroyLink}"/>
                    </p:column>
                </p:dataTable>

                <br />
                <h:commandLink action="#{sociolocalController.prepareCreate}" value="#{bundle.ListSociolocalCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListSociolocalIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
