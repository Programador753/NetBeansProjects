<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Nuevo Socio Local</ui:define>
        <ui:define name="body">
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            <h:form>
                <p:panel header="🤝 Socio Local">
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Código: *" for="codSocio"/>
                        <p:inputText id="codSocio" value="#{sociolocalController.selected.codSocio}" required="true" size="5"/>
                        <p:outputLabel value="Nombre: *" for="nomSocio"/>
                        <p:inputText id="nomSocio" value="#{sociolocalController.selected.nomSocio}" required="true" size="50"/>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Guardar" action="#{sociolocalController.create}" icon="pi pi-save"/>
                <p:commandButton value=" Volver" action="#{sociolocalController.prepareList}" immediate="true"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
