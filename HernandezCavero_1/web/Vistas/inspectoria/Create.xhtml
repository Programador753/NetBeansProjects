<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="Nueva Inspectoria"/>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <p:panel header="Datos de la Inspectoria">
                    <h:panelGrid columns="2" cellpadding="10" style="width:100%;">
                        
                        <p:outputLabel value="Codigo Inspectoria: *"/>
                        <p:inputText value="#{inspectoriaController.selected.codInspectoria}" 
                                     required="true" size="5" maxlength="3" placeholder="AFO"/>
                        
                        <p:outputLabel value="Nombre Inspectoria: *"/>
                        <p:inputText value="#{inspectoriaController.selected.nomInspectoria}" 
                                     required="true" size="60" style="width:400px;"/>
                        
                        <p:outputLabel value="Socio Local:"/>
                        <p:selectOneMenu value="#{inspectoriaController.selected.socioLocal}">
                            <f:selectItem itemLabel="-- Seleccione --" itemValue=""/>
                            <f:selectItem itemLabel="SDB - Salesiano" itemValue="SDB"/>
                            <f:selectItem itemLabel="FMA - Hija de Maria Auxiliadora" itemValue="FMA"/>
                            <f:selectItem itemLabel="HDS - Hermana de Don Bosco" itemValue="HDS"/>
                        </p:selectOneMenu>
                        
                        <p:outputLabel value="Responsable Legal:"/>
                        <p:inputText value="#{inspectoriaController.selected.responsableLegal}" size="50"/>
                        
                        <p:outputLabel value="OPD:"/>
                        <p:inputText value="#{inspectoriaController.selected.opd}" size="50"/>
                        
                        <p:outputLabel value="Contacto OPD - Nombre:"/>
                        <p:inputText value="#{inspectoriaController.selected.opdContactoNombre}" size="50"/>
                        
                        <p:outputLabel value="Contacto OPD - Email:"/>
                        <p:inputText value="#{inspectoriaController.selected.opdContactoMail}" size="50"/>
                        
                        <p:outputLabel value="Contacto OPD - Telefono:"/>
                        <p:inputText value="#{inspectoriaController.selected.opdContactoTelefono}" size="20"/>
                        
                    </h:panelGrid>
                </p:panel>
                
                <br/>
                <h:panelGroup style="display:flex; gap:10px;">
                    <p:commandButton value="Guardar" action="#{inspectoriaController.create}" 
                                     icon="pi pi-save" styleClass="ui-button-success"/>
                    <p:commandButton value="Volver al Listado" action="#{inspectoriaController.prepareList}" 
                                     icon="pi pi-arrow-left" styleClass="ui-button-secondary" immediate="true"/>
                </h:panelGroup>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
