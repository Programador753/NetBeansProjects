<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="Detalle Inspectoria: #{inspectoriaController.selected.codInspectoria}"/>
        </ui:define>
        <ui:define name="body">
            <h:form>
                <p:panel header="Informacion de la Inspectoria">
                    <h:panelGrid columns="4" cellpadding="10" style="width:100%;">
                        
                        <h:outputText value="Codigo:" style="font-weight:bold;"/>
                        <h:outputText value="#{inspectoriaController.selected.codInspectoria}" 
                                      style="font-size:1.2em; color:#1a237e;"/>
                        
                        <h:outputText value="Socio Local:" style="font-weight:bold;"/>
                        <h:outputText value="#{inspectoriaController.selected.socioLocal}"/>
                        
                        <h:outputText value="Nombre:" style="font-weight:bold;"/>
                        <h:outputText value="#{inspectoriaController.selected.nomInspectoria}" style="grid-column: span 3;"/>
                        
                        <h:outputText value="Responsable Legal:" style="font-weight:bold;"/>
                        <h:outputText value="#{inspectoriaController.selected.responsableLegal}" style="grid-column: span 3;"/>
                        
                    </h:panelGrid>
                </p:panel>
                
                <p:panel header="Contacto OPD" style="margin-top:15px;">
                    <h:panelGrid columns="4" cellpadding="10" style="width:100%;">
                        
                        <h:outputText value="OPD:" style="font-weight:bold;"/>
                        <h:outputText value="#{inspectoriaController.selected.opd}"/>
                        
                        <h:outputText value="Nombre Contacto:" style="font-weight:bold;"/>
                        <h:outputText value="#{inspectoriaController.selected.opdContactoNombre}"/>
                        
                        <h:outputText value="Email:" style="font-weight:bold;"/>
                        <h:outputLink value="mailto:#{inspectoriaController.selected.opdContactoMail}">
                            <h:outputText value="#{inspectoriaController.selected.opdContactoMail}"/>
                        </h:outputLink>
                        
                        <h:outputText value="Telefono:" style="font-weight:bold;"/>
                        <h:outputText value="#{inspectoriaController.selected.opdContactoTelefono}"/>
                        
                    </h:panelGrid>
                </p:panel>
                
                <p:panel header="Sedes de esta Inspectoria" style="margin-top:15px;">
                    <p:dataTable value="#{inspectoriaController.selected.sedeList}" var="sede"
                                 emptyMessage="No hay sedes registradas para esta inspectoria"
                                 rendered="#{not empty inspectoriaController.selected.sedeList}"
                                 rows="5" paginator="true">
                        <p:column headerText="Codigo" width="80">
                            <h:outputText value="#{sede.codSede}"/>
                        </p:column>
                        <p:column headerText="Nombre">
                            <h:outputText value="#{sede.nomSede}"/>
                        </p:column>
                        <p:column headerText="Ciudad" width="150">
                            <h:outputText value="#{sede.ciudad}"/>
                        </p:column>
                        <p:column headerText="Pais" width="80">
                            <h:outputText value="#{sede.pais}"/>
                        </p:column>
                    </p:dataTable>
                    <h:outputText value="No hay sedes registradas" 
                                  rendered="#{empty inspectoriaController.selected.sedeList}" style="color:#999;"/>
                </p:panel>
                
                <br/>
                <h:panelGroup style="display:flex; gap:10px;">
                    <p:commandButton value="Editar" action="#{inspectoriaController.prepareEdit}" 
                                     icon="pi pi-pencil" styleClass="ui-button-warning"/>
                    <p:commandButton value="Eliminar" action="#{inspectoriaController.destroy}" 
                                     icon="pi pi-trash" styleClass="ui-button-danger"
                                     onclick="return confirm('Esta seguro de eliminar esta inspectoria?');"/>
                    <p:commandButton value="Volver al Listado" action="#{inspectoriaController.prepareList}" 
                                     icon="pi pi-arrow-left" styleClass="ui-button-secondary"/>
                </h:panelGroup>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
