<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListInspectoriaTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <p:dataTable value="#{inspectoriaController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">

                    <p:column headerText="#{bundle.ListInspectoriaTitle_codigo}" sortBy="#{item.codigo}" filterBy="#{item.codigo}" filterMatchMode="contains">
                        <h:outputText value="#{item.codigo}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListInspectoriaTitle_socioLocal}" sortBy="#{item.socioLocal}" filterBy="#{item.socioLocal}" filterMatchMode="contains">
                        <h:outputText value="#{item.socioLocal}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListInspectoriaTitle_codInspectoria}" sortBy="#{item.codInspectoria}" filterBy="#{item.codInspectoria}" filterMatchMode="contains">
                        <h:outputText value="#{item.codInspectoria}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListInspectoriaTitle_nomInspectoria}" sortBy="#{item.nomInspectoria}" filterBy="#{item.nomInspectoria}" filterMatchMode="contains">
                        <h:outputText value="#{item.nomInspectoria}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListInspectoriaTitle_responsableLegal}">
                        <h:outputText value="#{item.responsableLegal}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListInspectoriaTitle_opd}">
                        <h:outputText value="#{item.opd}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListInspectoriaTitle_opdContactoNombre}">
                        <h:outputText value="#{item.opdContactoNombre}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListInspectoriaTitle_opdContactoMail}">
                        <h:outputText value="#{item.opdContactoMail}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListInspectoriaTitle_opdContactoTelefono}">
                        <h:outputText value="#{item.opdContactoTelefono}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="&nbsp;"/>
                        </f:facet>
                        <h:commandLink action="#{inspectoriaController.prepareView}" value="#{bundle.ListInspectoriaViewLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{inspectoriaController.prepareEdit}" value="#{bundle.ListInspectoriaEditLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{inspectoriaController.destroy}" value="#{bundle.ListInspectoriaDestroyLink}"/>
                    </p:column>
                </p:dataTable>
                <br />
                <h:commandLink action="#{inspectoriaController.prepareCreate}" value="#{bundle.ListInspectoriaCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListInspectoriaIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
