<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListTecnicoTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                    <p:dataTable value="#{tecnicoController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">
                        <p:column headerText="#{bundle.ListTecnicoTitle_codTecnico}"><h:outputText value="#{item.codTecnico}"/>
                        </p:column>
                        <p:column headerText="#{bundle.ListTecnicoTitle_nomTecnico}"><h:outputText value="#{item.nomTecnico}"/>
                        </p:column>
                        <p:column><h:commandLink action="#{tecnicoController.prepareView}" value="#{bundle.ListTecnicoViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{tecnicoController.prepareEdit}" value="#{bundle.ListTecnicoEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{tecnicoController.destroy}" value="#{bundle.ListTecnicoDestroyLink}"/>
                        </p:column>
                    </p:dataTable>
                <br />
                <h:commandLink action="#{tecnicoController.prepareCreate}" value="#{bundle.ListTecnicoCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListTecnicoIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
