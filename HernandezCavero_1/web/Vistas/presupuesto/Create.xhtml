<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Nuevo Presupuesto</ui:define>
        <ui:define name="body">
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            <h:form>
                <p:panel header="💹 Datos del Presupuesto">
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Proyecto:"/>
                        <h:selectOneMenu value="#{presupuestoController.selected.codProyecto}">
                            <f:selectItem itemLabel="-- Seleccione Proyecto --" itemValue=""/>
                            <f:selectItems value="#{proyectoController.itemsAvailableSelectOne}"/>
                        </h:selectOneMenu>
                        <p:outputLabel value="Partida:"/>
                        <h:selectOneMenu value="#{presupuestoController.selected.codPartida}">
                            <f:selectItem itemLabel="-- Seleccione Partida --" itemValue=""/>
                            <f:selectItems value="#{partidaController.itemsAvailableSelectOne}"/>
                        </h:selectOneMenu>
                        <p:outputLabel value="Cantidad Presupuestada (€): *"/>
                        <p:inputText value="#{presupuestoController.selected.cantidadPresupuestada}" required="true" size="15">
                            <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                        </p:inputText>
                        <p:outputLabel value="Cantidad Ejecutada (€):"/>
                        <p:inputText value="#{presupuestoController.selected.cantidadEjecutada}" size="15">
                            <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                        </p:inputText>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Guardar" action="#{presupuestoController.create}" icon="pi pi-save"/>
                <p:commandButton value=" Volver" action="#{presupuestoController.prepareList}" immediate="true"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
