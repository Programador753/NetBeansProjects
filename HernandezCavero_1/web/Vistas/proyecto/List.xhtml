<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListProyectoTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <p:dataTable value="#{proyectoController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">

                    <p:column headerText="#{bundle.ListProyectoTitle_codProyecto}" sortBy="#{item.codProyecto}" filterBy="#{item.codProyecto}" filterMatchMode="contains">
                        <h:outputText value="#{item.codProyecto}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListProyectoTitle_ong}" sortBy="#{item.ong}" filterBy="#{item.ong}" filterMatchMode="contains">
                        <h:outputText value="#{item.ong}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListProyectoTitle_codigo}" sortBy="#{item.codigo}" filterBy="#{item.codigo}" filterMatchMode="contains">
                        <h:outputText value="#{item.codigo}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListProyectoTitle_parte}" sortBy="#{item.parte}" filterBy="#{item.parte}" filterMatchMode="contains">
                        <h:outputText value="#{item.parte}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListProyectoTitle_referencia}" sortBy="#{item.referencia}" filterBy="#{item.referencia}" filterMatchMode="contains">
                        <h:outputText value="#{item.referencia}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListProyectoTitle_numProyecto}" sortBy="#{item.numProyecto}" filterBy="#{item.numProyecto}" filterMatchMode="contains">
                        <h:outputText value="#{item.numProyecto}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListProyectoTitle_instrumento}" sortBy="#{item.instrumento}" filterBy="#{item.instrumento}" filterMatchMode="contains">
                        <h:outputText value="#{item.instrumento}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListProyectoTitle_pais}" sortBy="#{item.pais}" filterBy="#{item.pais}" filterMatchMode="contains">
                        <h:outputText value="#{item.pais}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListProyectoTitle_localizacion}" sortBy="#{item.localizacion}" filterBy="#{item.localizacion}" filterMatchMode="contains">
                        <h:outputText value="#{item.localizacion}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListProyectoTitle_anyo}" sortBy="#{item.anyo}" filterBy="#{item.anyo}" filterMatchMode="contains">
                        <h:outputText value="#{item.anyo}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="&nbsp;"/>
                        </f:facet>
                        <h:commandLink action="#{proyectoController.prepareView}" value="#{bundle.ListProyectoViewLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{proyectoController.prepareEdit}" value="#{bundle.ListProyectoEditLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{proyectoController.destroy}" value="#{bundle.ListProyectoDestroyLink}"/>
                    </p:column>
                </p:dataTable>

                <br />
                <h:commandLink action="#{proyectoController.prepareCreate}" value="#{bundle.ListProyectoCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListProyectoIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
