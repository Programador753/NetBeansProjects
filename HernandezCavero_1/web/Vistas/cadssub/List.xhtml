<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListCadssubTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <p:dataTable value="#{cadssubController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">

                    <p:column headerText="#{bundle.ListCadssubTitle_codSubcad}" sortBy="#{item.codSubcad}" filterBy="#{item.codSubcad}" filterMatchMode="contains">
                        <h:outputText value="#{item.codSubcad}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListCadssubTitle_nomSubcad}" sortBy="#{item.nomSubcad}" filterBy="#{item.nomSubcad}" filterMatchMode="contains">
                        <h:outputText value="#{item.nomSubcad}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListCadssubTitle_nomsubcadING}" sortBy="#{item.nomsubcadING}" filterBy="#{item.nomsubcadING}" filterMatchMode="contains">
                        <h:outputText value="#{item.nomsubcadING}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListCadssubTitle_informacionESP}">
                        <h:outputText value="#{item.informacionESP}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListCadssubTitle_informacionING}">
                        <h:outputText value="#{item.informacionING}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListCadssubTitle_codCad}" sortBy="#{item.codCad.nomCad}" filterBy="#{item.codCad.nomCad}" filterMatchMode="contains">
                        <h:outputText value="#{item.codCad.nomCad}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="&nbsp;"/>
                        </f:facet>
                        <h:commandLink action="#{cadssubController.prepareView}" value="#{bundle.ListCadssubViewLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{cadssubController.prepareEdit}" value="#{bundle.ListCadssubEditLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{cadssubController.destroy}" value="#{bundle.ListCadssubDestroyLink}"/>
                    </p:column>
                </p:dataTable>

                <br />
                <h:commandLink action="#{cadssubController.prepareCreate}" value="#{bundle.ListCadssubCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListCadssubIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
