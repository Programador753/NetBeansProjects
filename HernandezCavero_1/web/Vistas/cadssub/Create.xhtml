<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Nuevo CAD Subsector</ui:define>
        <ui:define name="body">
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            <h:form>
                <p:panel header="📈 CAD Subsector">
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Código: *" for="codCadSub"/>
                        <p:inputText id="codCadSub" value="#{cadssubController.selected.codCadSub}" required="true" size="10"/>
                        <p:outputLabel value="Nombre (Español): *" for="nomCadSub"/>
                        <p:inputText id="nomCadSub" value="#{cadssubController.selected.nomCadSub}" required="true" size="80" style="width:500px;"/>
                        <p:outputLabel value="Nombre (Inglés):" for="nomCadSubIngles"/>
                        <p:inputText id="nomCadSubIngles" value="#{cadssubController.selected.nomCadSubIngles}" size="80" style="width:500px;"/>
                        <p:outputLabel value="CAD Padre:" for="codCad"/>
                        <h:selectOneMenu id="codCad" value="#{cadssubController.selected.codCad}">
                            <f:selectItem itemLabel="-- Seleccione --" itemValue=""/>
                            <f:selectItems value="#{cadController.itemsAvailableSelectOne}"/>
                        </h:selectOneMenu>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Guardar" action="#{cadssubController.create}" icon="pi pi-save"/>
                <p:commandButton value=" Volver" action="#{cadssubController.prepareList}" immediate="true"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
