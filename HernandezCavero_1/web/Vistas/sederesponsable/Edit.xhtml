<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Editar Asignación Sede-Responsable</ui:define>
        <ui:define name="body">
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            <h:form>
                <p:panel header=" Asignación Sede-Responsable">
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Sede:" for="sede"/>
                        <h:outputText value="#{sederesponsableController.selected.sede.nomSede}"/>
                        <p:outputLabel value="Responsable:" for="responsable"/>
                        <h:outputText value="#{sederesponsableController.selected.responsable.nomResponsable}"/>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Volver" action="#{sederesponsableController.prepareList}"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
