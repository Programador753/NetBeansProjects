<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListSederesponsableTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                    <p:dataTable value="#{sederesponsableController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">
                        <p:column headerText="#{bundle.ListSederesponsableTitle_sederesponsablePK_fechaInicio}"><h:outputText value="#{item.sederesponsablePK.fechaInicio}">
                                <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{bundle.ListSederesponsableTitle_fechaFin}"><h:outputText value="#{item.fechaFin}">
                                <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                            </h:outputText>
                        </p:column>
                        <p:column headerText="#{bundle.ListSederesponsableTitle_email}"><h:outputText value="#{item.email}"/>
                        </p:column>
                        <p:column headerText="#{bundle.ListSederesponsableTitle_telefono}"><h:outputText value="#{item.telefono}"/>
                        </p:column>
                        <p:column headerText="#{bundle.ListSederesponsableTitle_responsable}"><h:outputText value="#{item.responsable}"/>
                        </p:column>
                        <p:column headerText="#{bundle.ListSederesponsableTitle_sede}"><h:outputText value="#{item.sede}"/>
                        </p:column>
                        <p:column><h:commandLink action="#{sederesponsableController.prepareView}" value="#{bundle.ListSederesponsableViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{sederesponsableController.prepareEdit}" value="#{bundle.ListSederesponsableEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{sederesponsableController.destroy}" value="#{bundle.ListSederesponsableDestroyLink}"/>
                        </p:column>
                    </p:dataTable>
                <br />
                <h:commandLink action="#{sederesponsableController.prepareCreate}" value="#{bundle.ListSederesponsableCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListSederesponsableIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
