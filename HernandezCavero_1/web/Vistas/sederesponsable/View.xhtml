<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Detalle Sede-Responsable</ui:define>
        <ui:define name="body">
            <h:form>
                <p:panel header=" Asignación Sede-Responsable">
                    <h:panelGrid columns="2" cellpadding="10">
                        <h:outputText value="Sede:" style="font-weight:bold;"/>
                        <h:outputText value="#{sederesponsableController.selected.sede.nomSede}" rendered="#{sederesponsableController.selected.sede ne null}"/>
                        <h:outputText value="Responsable:" style="font-weight:bold;"/>
                        <h:outputText value="#{sederesponsableController.selected.responsable.nomResponsable}" rendered="#{sederesponsableController.selected.responsable ne null}"/>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Eliminar" action="#{sederesponsableController.destroy}" onclick="return confirm('¿Eliminar?');"/>
                <p:commandButton value=" Volver" action="#{sederesponsableController.prepareList}"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
