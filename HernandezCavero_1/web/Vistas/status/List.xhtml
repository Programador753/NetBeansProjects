<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListStatusTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <p:dataTable value="#{statusController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">

                    <p:column headerText="#{bundle.ListStatusTitle_codStatus}" sortBy="#{item.codStatus}" filterBy="#{item.codStatus}" filterMatchMode="contains">
                        <h:outputText value="#{item.codStatus}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListStatusTitle_nomStatus}" sortBy="#{item.nomStatus}" filterBy="#{item.nomStatus}" filterMatchMode="contains">
                        <h:outputText value="#{item.nomStatus}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="&nbsp;"/>
                        </f:facet>
                        <h:commandLink action="#{statusController.prepareView}" value="#{bundle.ListStatusViewLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{statusController.prepareEdit}" value="#{bundle.ListStatusEditLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{statusController.destroy}" value="#{bundle.ListStatusDestroyLink}"/>
                    </p:column>
                </p:dataTable>

                <br />
                <h:commandLink action="#{statusController.prepareCreate}" value="#{bundle.ListStatusCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListStatusIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
