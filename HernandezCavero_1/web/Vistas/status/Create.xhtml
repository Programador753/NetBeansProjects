<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Nuevo Estado</ui:define>
        <ui:define name="body">
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            <h:form>
                <p:panel header=" Estado de Proyecto">
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Código Estado: *" for="codStatus"/>
                        <p:inputText id="codStatus" value="#{statusController.selected.codStatus}" required="true" size="5"/>
                        <p:outputLabel value="Nombre Estado: *" for="nomStatus"/>
                        <p:inputText id="nomStatus" value="#{statusController.selected.nomStatus}" required="true" size="40"/>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Guardar" action="#{statusController.create}" icon="pi pi-save"/>
                <p:commandButton value=" Volver" action="#{statusController.prepareList}" immediate="true"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
