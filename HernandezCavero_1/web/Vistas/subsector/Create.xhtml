<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">Nuevo Subsector MS</ui:define>
        <ui:define name="body">
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            <h:form>
                <p:panel header="Datos del Subsector">
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Codigo: *"/>
                        <p:inputText value="#{subsectorController.selected.codSubsector}" required="true" size="5"/>
                        <p:outputLabel value="Sector Padre:"/>
                        <h:selectOneMenu value="#{subsectorController.selected.codSector}">
                            <f:selectItem itemLabel="-- Seleccione Sector --" itemValue=""/>
                            <f:selectItems value="#{sectorController.itemsAvailableSelectOne}"/>
                        </h:selectOneMenu>
                        <p:outputLabel value="Nombre: *"/>
                        <p:inputText value="#{subsectorController.selected.nomSubsector}" required="true" size="60" style="width:400px;"/>
                        <p:outputLabel value="Descripcion:"/>
                        <p:inputTextarea value="#{subsectorController.selected.descripcion}" rows="3" cols="50"/>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value="Guardar" action="#{subsectorController.create}" icon="pi pi-save"/>
                <p:commandButton value="Volver" action="#{subsectorController.prepareList}" immediate="true"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
