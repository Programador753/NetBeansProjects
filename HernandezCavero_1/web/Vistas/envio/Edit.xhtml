<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="Editar Envio"/>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <p:panel header="Datos del Envio">
                    <h:panelGrid columns="2" cellpadding="10" style="width:100%;">
                        
                        <p:outputLabel value="Codigo Proyecto:"/>
                        <p:inputText value="#{envioController.selected.envioPK.codigo}" disabled="true"/>
                        
                        <p:outputLabel value="Fecha Envio:"/>
                        <p:calendar value="#{envioController.selected.envioPK.fecha}" 
                                    pattern="dd/MM/yyyy" showOn="button" disabled="true"/>
                        
                        <p:outputLabel value="Cantidad (EUR): *"/>
                        <p:inputText value="#{envioController.selected.cantidad}" 
                                     required="true" size="15">
                            <f:convertNumber minFractionDigits="2" maxFractionDigits="2"/>
                        </p:inputText>
                        
                        <p:outputLabel value="Acuse Recibo MS:"/>
                        <p:selectBooleanCheckbox value="#{envioController.selected.acuseReciboMs}"/>
                        
                        <p:outputLabel value="Acuse Banco:"/>
                        <p:selectBooleanCheckbox value="#{envioController.selected.acuseBanco}"/>
                        
                        <p:outputLabel value="Comentario:"/>
                        <p:inputTextarea value="#{envioController.selected.comentario}" 
                                         rows="3" cols="50"/>
                        
                    </h:panelGrid>
                </p:panel>
                
                <br/>
                <h:panelGroup style="display:flex; gap:10px;">
                    <p:commandButton value="Guardar Cambios" action="#{envioController.update}" 
                                     icon="pi pi-save" styleClass="ui-button-success"/>
                    <p:commandButton value="Ver Detalle" action="#{envioController.prepareView}" 
                                     icon="pi pi-eye" styleClass="ui-button-info"/>
                    <p:commandButton value="Volver al Listado" action="#{envioController.prepareList}" 
                                     icon="pi pi-arrow-left" styleClass="ui-button-secondary" immediate="true"/>
                </h:panelGroup>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
