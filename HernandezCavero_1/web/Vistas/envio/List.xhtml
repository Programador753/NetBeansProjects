<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="Listado de Envios"/>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                
                <p:dataTable value="#{envioController.items}" var="item" 
                             rows="10" 
                             paginator="true" 
                             paginatorPosition="both"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} envios"
                             rowsPerPageTemplate="5,10,25,50"
                             emptyMessage="No hay envios registrados"
                             tableStyle="table-layout:auto"
                             style="margin-top:20px;">
                    
                    <!-- Codigo Proyecto -->
                    <p:column headerText="Cod. Proy." sortBy="#{item.envioPK.codigo}" style="text-align:center; width:90px;">
                        <h:outputText value="#{item.envioPK.codigo}" style="font-weight:bold; color:#1a237e;"/>
                    </p:column>
                    
                    <!-- Proyecto (Titulo) -->
                    <p:column headerText="Proyecto" sortBy="#{item.proyecto.titulo}">
                        <h:outputText value="#{item.proyecto.titulo}" rendered="#{item.proyecto ne null}"/>
                        <h:outputText value="-" rendered="#{item.proyecto eq null}" style="color:#999;"/>
                    </p:column>
                    
                    <!-- Fecha -->
                    <p:column headerText="Fecha" sortBy="#{item.envioPK.fecha}" style="text-align:center; width:80px;">
                        <h:outputText value="#{item.envioPK.fecha}">
                            <f:convertDateTime pattern="dd/MM/yy"/>
                        </h:outputText>
                    </p:column>
                    
                    <!-- Cantidad -->
                    <p:column headerText="Cantidad" sortBy="#{item.cantidad}" style="text-align:right; width:100px;">
                        <h:outputText value="#{item.cantidad}" styleClass="currency" style="font-weight:bold; color:#4CAF50;">
                            <f:convertNumber type="number" groupingUsed="true" minFractionDigits="0" maxFractionDigits="0"/>
                        </h:outputText>
                        <h:outputText value=" EUR" style="font-size:0.8em;"/>
                    </p:column>
                    
                    <!-- Acuse Recibo MS -->
                    <p:column headerText="MS" style="text-align:center; width:50px;">
                        <h:outputText value="Si" rendered="#{item.acuseReciboMs eq true}" style="color:#4CAF50; font-weight:bold;"/>
                        <h:outputText value="No" rendered="#{item.acuseReciboMs eq false or item.acuseReciboMs eq null}" 
                                      style="color:#FF9800;"/>
                    </p:column>
                    
                    <!-- Acuse Banco -->
                    <p:column headerText="Banco" style="text-align:center; width:50px;">
                        <h:outputText value="Si" rendered="#{item.acuseBanco eq true}" style="color:#4CAF50; font-weight:bold;"/>
                        <h:outputText value="No" rendered="#{item.acuseBanco eq false or item.acuseBanco eq null}" 
                                      style="color:#FF9800;"/>
                    </p:column>
                    
                    <!-- Acciones -->
                    <p:column headerText="Acciones" style="text-align:center; width:120px;" exportable="false">
                        <h:commandLink action="#{envioController.prepareView}" value="Ver" 
                                       title="Ver detalles" style="margin-right:5px;"/>
                        <h:commandLink action="#{envioController.prepareEdit}" value="Editar" 
                                       title="Editar envio" style="margin-right:5px;"/>
                        <h:commandLink action="#{envioController.destroy}" value="X" 
                                       title="Eliminar envio" style="color:red;"
                                       onclick="return confirm('Esta seguro de eliminar este envio?');"/>
                    </p:column>
                    
                </p:dataTable>
                
                <br />
                <p:commandButton value="Nuevo Envio" action="#{envioController.prepareCreate}" 
                                 icon="pi pi-plus" styleClass="ui-button-success"/>
                <br /><br />
                <h:link outcome="/index" value="Volver al Inicio"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
