<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListEnvioTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <p:dataTable value="#{envioController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">

                    <p:column headerText="#{bundle.ListEnvioTitle_envioPK_fecha}" sortBy="#{item.envioPK.fecha}" filterBy="#{item.envioPK.fecha}" filterMatchMode="contains">
                        <h:outputText value="#{item.envioPK.fecha}">
                            <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="#{bundle.ListEnvioTitle_cantidad}" sortBy="#{item.cantidad}" filterBy="#{item.cantidad}" filterMatchMode="contains">
                        <h:outputText value="#{item.cantidad}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListEnvioTitle_acuseReciboMs}" sortBy="#{item.acuseReciboMs}" filterBy="#{item.acuseReciboMs}" filterMatchMode="contains">
                        <h:outputText value="#{item.acuseReciboMs}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListEnvioTitle_acuseBanco}" sortBy="#{item.acuseBanco}" filterBy="#{item.acuseBanco}" filterMatchMode="contains">
                        <h:outputText value="#{item.acuseBanco}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListEnvioTitle_comentario}" sortBy="#{item.comentario}" filterBy="#{item.comentario}" filterMatchMode="contains">
                        <h:outputText value="#{item.comentario}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListEnvioTitle_proyecto}" sortBy="#{item.proyecto}" filterBy="#{item.proyecto}" filterMatchMode="contains">
                        <h:outputText value="#{item.proyecto}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="&nbsp;"/>
                        </f:facet>
                        <h:commandLink action="#{envioController.prepareView}" value="#{bundle.ListEnvioViewLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{envioController.prepareEdit}" value="#{bundle.ListEnvioEditLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{envioController.destroy}" value="#{bundle.ListEnvioDestroyLink}"/>
                    </p:column>
                </p:dataTable>
                <br />
                <h:commandLink action="#{envioController.prepareCreate}" value="#{bundle.ListEnvioCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListEnvioIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
