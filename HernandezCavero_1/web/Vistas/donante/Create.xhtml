<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Nuevo Donante</ui:define>
        <ui:define name="body">
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            <h:form>
                <p:panel header=" Datos del Donante">
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Nombre: *"/>
                        <p:inputText value="#{donanteController.selected.nomDonante}" required="true" size="60" style="width:400px;"/>
                        <p:outputLabel value="Apellidos:"/>
                        <p:inputText value="#{donanteController.selected.apellidosDonante}" size="60" style="width:400px;"/>
                        <p:outputLabel value="Email:"/>
                        <p:inputText value="#{donanteController.selected.email}" size="50"/>
                        <p:outputLabel value="Teléfono:"/>
                        <p:inputText value="#{donanteController.selected.telefono}" size="20"/>
                        <p:outputLabel value="Dirección:"/>
                        <p:inputText value="#{donanteController.selected.direccion}" size="60" style="width:400px;"/>
                        <p:outputLabel value="Ciudad:"/>
                        <p:inputText value="#{donanteController.selected.ciudad}" size="30"/>
                        <p:outputLabel value="País:"/>
                        <p:inputText value="#{donanteController.selected.pais}" size="4" maxlength="2"/>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Guardar" action="#{donanteController.create}" icon="pi pi-save"/>
                <p:commandButton value=" Volver" action="#{donanteController.prepareList}" immediate="true"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
