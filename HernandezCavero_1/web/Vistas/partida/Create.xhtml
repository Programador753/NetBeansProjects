<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Nueva Partida Presupuestaria</ui:define>
        <ui:define name="body">
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            <h:form>
                <p:panel header=" Datos de la Partida">
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Código: *"/>
                        <p:inputText value="#{partidaController.selected.codPartida}" required="true" size="10"/>
                        <p:outputLabel value="Nombre: *"/>
                        <p:inputText value="#{partidaController.selected.nomPartida}" required="true" size="60" style="width:400px;"/>
                        <p:outputLabel value="Descripción:"/>
                        <p:inputTextarea value="#{partidaController.selected.descripcion}" rows="3" cols="50"/>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Guardar" action="#{partidaController.create}" icon="pi pi-save"/>
                <p:commandButton value=" Volver" action="#{partidaController.prepareList}" immediate="true"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
