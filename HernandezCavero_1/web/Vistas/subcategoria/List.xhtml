<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListSubcategoriaTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <p:dataTable value="#{subcategoriaController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">

                    <p:column headerText="#{bundle.ListSubcategoriaTitle_codSubcategoria}" sortBy="#{item.codSubcategoria}" filterBy="#{item.codSubcategoria}" filterMatchMode="contains">
                        <h:outputText value="#{item.codSubcategoria}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListSubcategoriaTitle_nomSubcategoria}" sortBy="#{item.nomSubcategoria}" filterBy="#{item.nomSubcategoria}" filterMatchMode="contains">
                        <h:outputText value="#{item.nomSubcategoria}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListSubcategoriaTitle_descripcion}">
                        <h:outputText value="#{item.descripcion}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListSubcategoriaTitle_codCategoria}" sortBy="#{item.codCategoria}" filterBy="#{item.codCategoria}" filterMatchMode="contains">
                        <h:outputText value="#{item.codCategoria}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="&nbsp;"/>
                        </f:facet>
                        <h:commandLink action="#{subcategoriaController.prepareView}" value="#{bundle.ListSubcategoriaViewLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{subcategoriaController.prepareEdit}" value="#{bundle.ListSubcategoriaEditLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{subcategoriaController.destroy}" value="#{bundle.ListSubcategoriaDestroyLink}"/>
                    </p:column>
                </p:dataTable>

                <br />
                <h:commandLink action="#{subcategoriaController.prepareCreate}" value="#{bundle.ListSubcategoriaCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListSubcategoriaIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
