<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Nueva Subcategoría</ui:define>
        <ui:define name="body">
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            <h:form>
                <p:panel header=" Subcategoría">
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Código: *" for="codSubcategoria"/>
                        <p:inputText id="codSubcategoria" value="#{subcategoriaController.selected.codSubcategoria}" required="true" size="5"/>
                        <p:outputLabel value="Nombre: *" for="nomSubcategoria"/>
                        <p:inputText id="nomSubcategoria" value="#{subcategoriaController.selected.nomSubcategoria}" required="true" size="50"/>
                        <p:outputLabel value="Categoría Padre:" for="categoria"/>
                        <h:selectOneMenu id="categoria" value="#{subcategoriaController.selected.categoria}">
                            <f:selectItem itemLabel="-- Seleccione --" itemValue=""/>
                            <f:selectItems value="#{categoriaController.itemsAvailableSelectOne}"/>
                        </h:selectOneMenu>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Guardar" action="#{subcategoriaController.create}" icon="pi pi-save"/>
                <p:commandButton value=" Volver" action="#{subcategoriaController.prepareList}" immediate="true"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
