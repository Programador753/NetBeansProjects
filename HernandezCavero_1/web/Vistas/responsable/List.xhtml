<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListResponsableTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <p:dataTable value="#{responsableController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">

                    <p:column headerText="#{bundle.ListResponsableTitle_codResponsable}" sortBy="#{item.codResponsable}" filterBy="#{item.codResponsable}" filterMatchMode="contains">
                        <h:outputText value="#{item.codResponsable}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListResponsableTitle_nomResponsable}" sortBy="#{item.nomResponsable}" filterBy="#{item.nomResponsable}" filterMatchMode="contains">
                        <h:outputText value="#{item.nomResponsable}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListResponsableTitle_tratamiento}" sortBy="#{item.tratamiento}" filterBy="#{item.tratamiento}" filterMatchMode="contains">
                        <h:outputText value="#{item.tratamiento}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListResponsableTitle_tipoMisionero}" sortBy="#{item.tipoMisionero}" filterBy="#{item.tipoMisionero}" filterMatchMode="contains">
                        <h:outputText value="#{item.tipoMisionero}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="&nbsp;"/>
                        </f:facet>
                        <h:commandLink action="#{responsableController.prepareView}" value="#{bundle.ListResponsableViewLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{responsableController.prepareEdit}" value="#{bundle.ListResponsableEditLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{responsableController.destroy}" value="#{bundle.ListResponsableDestroyLink}"/>
                    </p:column>
                </p:dataTable>

                <br />
                <h:commandLink action="#{responsableController.prepareCreate}" value="#{bundle.ListResponsableCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListResponsableIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
