<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="Listado de Responsables"/>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                
                <p:dataTable value="#{responsableController.items}" var="item" 
                             rows="10" 
                             paginator="true" 
                             paginatorPosition="both"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} responsables"
                             rowsPerPageTemplate="5,10,25"
                             emptyMessage="No hay responsables registrados"
                             tableStyle="table-layout:auto"
                             style="margin-top:20px;">
                    
                    <!-- Codigo -->
                    <p:column headerText="Cod." sortBy="#{item.codResponsable}" style="text-align:center; width:60px;">
                        <h:outputText value="#{item.codResponsable}" style="font-weight:bold; color:#1a237e;"/>
                    </p:column>
                    
                    <!-- Nombre -->
                    <p:column headerText="Nombre" sortBy="#{item.nomResponsable}">
                        <h:outputText value="#{item.nomResponsable}"/>
                    </p:column>
                    
                    <!-- Tratamiento -->
                    <p:column headerText="Tratamiento" sortBy="#{item.tratamiento}" style="width:120px;">
                        <h:outputText value="#{item.tratamiento}"/>
                    </p:column>
                    
                    <!-- Tipo Misionero -->
                    <p:column headerText="Tipo" sortBy="#{item.tipoMisionero}" style="text-align:center; width:60px;">
                        <h:outputText value="#{item.tipoMisionero}"/>
                    </p:column>
                    
                    <!-- Acciones -->
                    <p:column headerText="Acciones" style="text-align:center; width:120px;" exportable="false">
                        <h:commandLink action="#{responsableController.prepareView}" value="Ver" 
                                       title="Ver detalles" style="margin-right:5px;"/>
                        <h:commandLink action="#{responsableController.prepareEdit}" value="Editar" 
                                       title="Editar responsable" style="margin-right:5px;"/>
                        <h:commandLink action="#{responsableController.destroy}" value="X" 
                                       title="Eliminar responsable" style="color:red;"
                                       onclick="return confirm('Esta seguro de eliminar este responsable?');"/>
                    </p:column>
                    
                </p:dataTable>
                
                <br />
                <p:commandButton value="Nuevo Responsable" action="#{responsableController.prepareCreate}" 
                                 icon="pi pi-plus" styleClass="ui-button-success"/>
                <br /><br />
                <h:link outcome="/index" value="Volver al Inicio"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
