<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="Detalle Responsable: #{responsableController.selected.nomResponsable}"/>
        </ui:define>
        <ui:define name="body">
            <h:form>
                <p:panel header="Informacion del Responsable">
                    <h:panelGrid columns="2" cellpadding="10" style="width:100%;">
                        
                        <h:outputText value="Codigo:" style="font-weight:bold;"/>
                        <h:outputText value="#{responsableController.selected.codResponsable}" style="font-size:1.2em; color:#1a237e;"/>
                        
                        <h:outputText value="Nombre:" style="font-weight:bold;"/>
                        <h:outputText value="#{responsableController.selected.nomResponsable}" style="font-size:1.1em;"/>
                        
                        <h:outputText value="Tratamiento:" style="font-weight:bold;"/>
                        <h:outputText value="#{responsableController.selected.tratamiento}"/>
                        
                        <h:outputText value="Tipo Misionero:" style="font-weight:bold;"/>
                        <h:outputText value="#{responsableController.selected.tipoMisionero}"/>
                        
                    </h:panelGrid>
                </p:panel>
                
                <br/>
                <h:panelGroup style="display:flex; gap:10px;">
                    <p:commandButton value="Editar" action="#{responsableController.prepareEdit}" 
                                     icon="pi pi-pencil" styleClass="ui-button-warning"/>
                    <p:commandButton value="Eliminar" action="#{responsableController.destroy}" 
                                     icon="pi pi-trash" styleClass="ui-button-danger"
                                     onclick="return confirm('Esta seguro de eliminar este responsable?');"/>
                    <p:commandButton value="Volver al Listado" action="#{responsableController.prepareList}" 
                                     icon="pi pi-arrow-left" styleClass="ui-button-secondary"/>
                </h:panelGroup>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
