<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value=" Listado de Sectores"/>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                
                <p:dataTable value="#{sectorController.items}" var="item" 
                             rows="10" 
                             paginator="true" 
                             paginatorPosition="both"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} sectores"
                             rowsPerPageTemplate="5,10,25"
                             emptyMessage="No hay sectores registrados"
                             style="margin-top:20px;">
                    
                    <!-- Código -->
                    <p:column headerText="Código" sortBy="#{item.codSector}" width="100" style="text-align:center">
                        <h:outputText value="#{item.codSector}" style="font-weight:bold; color:#1a237e;"/>
                    </p:column>
                    
                    <!-- Nombre -->
                    <p:column headerText="Nombre del Sector" sortBy="#{item.nomSector}">
                        <h:outputText value="#{item.nomSector}"/>
                    </p:column>
                    
                    <!-- Acciones -->
                    <p:column headerText="Acciones" width="180" style="text-align:center" exportable="false">
                        <h:commandLink action="#{sectorController.prepareView}" value=" Ver" 
                                       title="Ver detalles" style="margin-right:8px;"/>
                        <h:commandLink action="#{sectorController.prepareEdit}" value=" Editar" 
                                       title="Editar sector" style="margin-right:8px;"/>
                        <h:commandLink action="#{sectorController.destroy}" value=" Eliminar" 
                                       title="Eliminar sector"
                                       onclick="return confirm('¿Está seguro de eliminar este sector?');"/>
                    </p:column>
                    
                </p:dataTable>
                
                <br />
                <p:commandButton value=" Nuevo Sector" action="#{sectorController.prepareCreate}" 
                                 icon="pi pi-plus" styleClass="ui-button-success"/>
                <br /><br />
                <h:link outcome="/index" value=" Volver al Inicio"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
