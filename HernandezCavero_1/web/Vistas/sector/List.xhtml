<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListSectorTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <p:dataTable value="#{sectorController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">

                    <p:column headerText="#{bundle.ListSectorTitle_codSector}" sortBy="#{item.codSector}" filterBy="#{item.codSector}" filterMatchMode="contains">
                        <h:outputText value="#{item.codSector}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListSectorTitle_nomSector}" sortBy="#{item.nomSector}" filterBy="#{item.nomSector}" filterMatchMode="contains">
                        <h:outputText value="#{item.nomSector}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListSectorTitle_nomsectorIng}" sortBy="#{item.nomsectorIng}" filterBy="#{item.nomsectorIng}" filterMatchMode="contains">
                        <h:outputText value="#{item.nomsectorIng}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListSectorTitle_sectorCad}" sortBy="#{item.sectorCad}" filterBy="#{item.sectorCad}" filterMatchMode="contains">
                        <h:outputText value="#{item.sectorCad}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListSectorTitle_explicacion}" sortBy="#{item.explicacion}" filterBy="#{item.explicacion}" filterMatchMode="contains">
                        <h:outputText value="#{item.explicacion}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListSectorTitle_explicacionIng}" sortBy="#{item.explicacionIng}" filterBy="#{item.explicacionIng}" filterMatchMode="contains">
                        <h:outputText value="#{item.explicacionIng}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="&nbsp;"/>
                        </f:facet>
                        <h:commandLink action="#{sectorController.prepareView}" value="#{bundle.ListSectorViewLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{sectorController.prepareEdit}" value="#{bundle.ListSectorEditLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{sectorController.destroy}" value="#{bundle.ListSectorDestroyLink}"/>
                    </p:column>
                </p:dataTable>
                <br />
                <h:commandLink action="#{sectorController.prepareCreate}" value="#{bundle.ListSectorCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListSectorIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
