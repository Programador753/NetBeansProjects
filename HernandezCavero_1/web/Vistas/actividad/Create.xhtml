<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Nueva Actividad</ui:define>
        <ui:define name="body">
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            <h:form>
                <p:panel header=" Datos de la Actividad">
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Proyecto:"/>
                        <h:selectOneMenu value="#{actividadController.selected.codProyecto}">
                            <f:selectItem itemLabel="-- Seleccione Proyecto --" itemValue=""/>
                            <f:selectItems value="#{proyectoController.itemsAvailableSelectOne}"/>
                        </h:selectOneMenu>
                        <p:outputLabel value="Nombre Actividad: *"/>
                        <p:inputText value="#{actividadController.selected.nomActividad}" required="true" size="60" style="width:400px;"/>
                        <p:outputLabel value="Descripción:"/>
                        <p:inputTextarea value="#{actividadController.selected.descripcion}" rows="3" cols="60" style="width:400px;"/>
                        <p:outputLabel value="Fecha Inicio:"/>
                        <p:calendar value="#{actividadController.selected.fechaInicio}" pattern="dd/MM/yyyy" showOn="button"/>
                        <p:outputLabel value="Fecha Fin:"/>
                        <p:calendar value="#{actividadController.selected.fechaFin}" pattern="dd/MM/yyyy" showOn="button"/>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Guardar" action="#{actividadController.create}" icon="pi pi-save"/>
                <p:commandButton value=" Volver" action="#{actividadController.prepareList}" immediate="true"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
