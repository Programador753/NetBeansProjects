<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value=" Detalle Misión: #{misionController.selected.nomMision}"/>
        </ui:define>
        <ui:define name="body">
            <h:form>
                <p:panel header=" Información de la Misión">
                    <h:panelGrid columns="4" cellpadding="10" style="width:100%;">
                        
                        <h:outputText value="Código:" style="font-weight:bold;"/>
                        <h:outputText value="#{misionController.selected.codMision}" style="font-size:1.2em; color:#1a237e;"/>
                        
                        <h:outputText value="Inspectoría:" style="font-weight:bold;"/>
                        <h:outputText value="#{misionController.selected.codInspectoria}"/>
                        
                        <h:outputText value="Nombre:" style="font-weight:bold;"/>
                        <h:outputText value="#{misionController.selected.nomMision}" style="grid-column: span 3; font-size:1.1em;"/>
                        
                        <h:outputText value="Ciudad:" style="font-weight:bold;"/>
                        <h:outputText value="#{misionController.selected.ciudad}"/>
                        
                        <h:outputText value="Provincia:" style="font-weight:bold;"/>
                        <h:outputText value="#{misionController.selected.provincia}"/>
                        
                        <h:outputText value="País:" style="font-weight:bold;"/>
                        <h:outputText value="#{misionController.selected.pais}"/>
                        
                        <h:outputText value="Teléfono:" style="font-weight:bold;"/>
                        <h:outputText value="#{misionController.selected.telefono}"/>
                        
                        <h:outputText value="Dirección:" style="font-weight:bold;"/>
                        <h:panelGroup style="grid-column: span 3;">
                            <h:outputText value="#{misionController.selected.direccion1}"/>
                            <br rendered="#{misionController.selected.direccion2 ne null}"/>
                            <h:outputText value="#{misionController.selected.direccion2}"/>
                        </h:panelGroup>
                        
                    </h:panelGrid>
                </p:panel>
                
                <br/>
                <h:panelGroup style="display:flex; gap:10px;">
                    <p:commandButton value=" Editar" action="#{misionController.prepareEdit}" 
                                     icon="pi pi-pencil" styleClass="ui-button-warning"/>
                    <p:commandButton value=" Eliminar" action="#{misionController.destroy}" 
                                     icon="pi pi-trash" styleClass="ui-button-danger"
                                     onclick="return confirm('¿Está seguro de eliminar esta misión?');"/>
                    <p:commandButton value=" Volver al Listado" action="#{misionController.prepareList}" 
                                     icon="pi pi-arrow-left" styleClass="ui-button-secondary"/>
                </h:panelGroup>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
