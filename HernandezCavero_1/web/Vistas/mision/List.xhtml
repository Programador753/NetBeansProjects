<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListMisionTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <p:dataTable value="#{misionController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">

                    <p:column headerText="#{bundle.ListMisionTitle_codMision}" sortBy="#{item.codMision}" filterBy="#{item.codMision}" filterMatchMode="contains">
                        <h:outputText value="#{item.codMision}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListMisionTitle_nomMision}" sortBy="#{item.nomMision}" filterBy="#{item.nomMision}" filterMatchMode="contains">
                        <h:outputText value="#{item.nomMision}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListMisionTitle_codInspectoria}">
                        <h:outputText value="#{item.codInspectoria}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListMisionTitle_direccion1}">
                        <h:outputText value="#{item.direccion1}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListMisionTitle_direccion2}">
                        <h:outputText value="#{item.direccion2}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListMisionTitle_provincia}">
                        <h:outputText value="#{item.provincia}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListMisionTitle_ciudad}">
                        <h:outputText value="#{item.ciudad}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListMisionTitle_pais}">
                        <h:outputText value="#{item.pais}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListMisionTitle_telefono}">
                        <h:outputText value="#{item.telefono}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="&nbsp;"/>
                        </f:facet>
                        <h:commandLink action="#{misionController.prepareView}" value="#{bundle.ListMisionViewLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{misionController.prepareEdit}" value="#{bundle.ListMisionEditLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{misionController.destroy}" value="#{bundle.ListMisionDestroyLink}"/>
                    </p:column>
                </p:dataTable>
                <br />
                <h:commandLink action="#{misionController.prepareCreate}" value="#{bundle.ListMisionCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListMisionIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
