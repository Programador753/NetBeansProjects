<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">Editar Sector CRS: #{crsController.selected.nomCrs}</ui:define>
        <ui:define name="body">
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            <h:form>
                <p:panel header="Datos del Sector CRS">
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Codigo CRS:"/>
                        <p:inputText value="#{crsController.selected.codCrs}" disabled="true"/>
                        <p:outputLabel value="Sector CAD:"/>
                        <h:selectOneMenu value="#{crsController.selected.codCad}">
                            <f:selectItem itemLabel="-- Seleccione CAD --" itemValue=""/>
                            <f:selectItems value="#{cadController.itemsAvailableSelectOne}"/>
                        </h:selectOneMenu>
                        <p:outputLabel value="Nombre (Espanol): *"/>
                        <p:inputText value="#{crsController.selected.nomCrs}" required="true" size="60" style="width:400px;"/>
                        <p:outputLabel value="Descripcion:"/>
                        <p:inputTextarea value="#{crsController.selected.descripcion}" rows="3" cols="50"/>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value="Guardar" action="#{crsController.update}" icon="pi pi-save"/>
                <p:commandButton value="Volver" action="#{crsController.prepareList}" immediate="true"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
