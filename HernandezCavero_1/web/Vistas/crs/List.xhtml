<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListCrsTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <p:dataTable value="#{crsController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">

                    <p:column headerText="#{bundle.ListCrsTitle_codCrs}" sortBy="#{item.codCrs}" filterBy="#{item.codCrs}" filterMatchMode="contains">
                        <h:outputText value="#{item.codCrs}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListCrsTitle_nomCrs}" sortBy="#{item.nomCrs}" filterBy="#{item.nomCrs}" filterMatchMode="contains">
                        <h:outputText value="#{item.nomCrs}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListCrsTitle_nomcrsIngles}" sortBy="#{item.nomcrsIngles}" filterBy="#{item.nomcrsIngles}" filterMatchMode="contains">
                        <h:outputText value="#{item.nomcrsIngles}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListCrsTitle_informacionesESP}">
                        <h:outputText value="#{item.informacionesESP}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListCrsTitle_informacionesING}">
                        <h:outputText value="#{item.informacionesING}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListCrsTitle_codCadsub}" sortBy="#{item.codCadsub}" filterBy="#{item.codCadsub}" filterMatchMode="contains">
                        <h:outputText value="#{item.codCadsub}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="&nbsp;"/>
                        </f:facet>
                        <h:commandLink action="#{crsController.prepareView}" value="#{bundle.ListCrsViewLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{crsController.prepareEdit}" value="#{bundle.ListCrsEditLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{crsController.destroy}" value="#{bundle.ListCrsDestroyLink}"/>
                    </p:column>
                </p:dataTable>
                <br />
                <h:commandLink action="#{crsController.prepareCreate}" value="#{bundle.ListCrsCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListCrsIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
