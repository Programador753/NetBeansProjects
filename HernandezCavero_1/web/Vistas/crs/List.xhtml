<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value=" Listado de Códigos CRS"/>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                
                <p:dataTable value="#{crsController.items}" var="item" 
                             rows="15" 
                             paginator="true" 
                             paginatorPosition="both"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords} códigos CRS"
                             rowsPerPageTemplate="10,15,25,50"
                             emptyMessage="No hay códigos CRS registrados"
                             style="margin-top:20px;">
                    
                    <!-- Código CRS -->
                    <p:column headerText="Código CRS" sortBy="#{item.codCrs}" width="120" style="text-align:center">
                        <h:outputText value="#{item.codCrs}" style="font-weight:bold; color:#1a237e;"/>
                    </p:column>
                    
                    <!-- Nombre -->
                    <p:column headerText="Descripción" sortBy="#{item.nomCrs}">
                        <h:outputText value="#{item.nomCrs}"/>
                    </p:column>
                    
                    <!-- Subcategoría CAD -->
                    <p:column headerText="Subcategoría CAD" sortBy="#{item.codSubcad}" width="150" style="text-align:center">
                        <h:outputText value="#{item.codSubcad}"/>
                    </p:column>
                    
                    <!-- Número de Proyectos -->
                    <p:column headerText="Proyectos Asociados" width="150" style="text-align:center">
                        <h:outputText value="#{item.proyectoList.size()}" rendered="#{item.proyectoList ne null}" 
                                      style="font-weight:bold; color:#4CAF50;"/>
                        <h:outputText value="0" rendered="#{item.proyectoList eq null}" style="color:#999;"/>
                    </p:column>
                    
                    <!-- Acciones -->
                    <p:column headerText="Acciones" width="180" style="text-align:center" exportable="false">
                        <h:commandLink action="#{crsController.prepareView}" value=" Ver" 
                                       title="Ver detalles" style="margin-right:8px;"/>
                        <h:commandLink action="#{crsController.prepareEdit}" value=" Editar" 
                                       title="Editar CRS" style="margin-right:8px;"/>
                        <h:commandLink action="#{crsController.destroy}" value=" Eliminar" 
                                       title="Eliminar CRS"
                                       onclick="return confirm('¿Está seguro de eliminar este código CRS?');"/>
                    </p:column>
                    
                </p:dataTable>
                
                <br />
                <p:commandButton value=" Nuevo CRS" action="#{crsController.prepareCreate}" 
                                 icon="pi pi-plus" styleClass="ui-button-success"/>
                <br /><br />
                <h:link outcome="/index" value=" Volver al Inicio"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
