<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListEntidadTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <p:dataTable value="#{entidadController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">

                    <p:column headerText="#{bundle.ListEntidadTitle_codigo}" sortBy="#{item.codigo}" filterBy="#{item.codigo}" filterMatchMode="contains">
                        <h:outputText value="#{item.codigo}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListEntidadTitle_tipoEntidad}" sortBy="#{item.tipoEntidad}" filterBy="#{item.tipoEntidad}" filterMatchMode="contains">
                        <h:outputText value="#{item.tipoEntidad}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListEntidadTitle_nomEntidad}" sortBy="#{item.nomEntidad}" filterBy="#{item.nomEntidad}" filterMatchMode="contains">
                        <h:outputText value="#{item.nomEntidad}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="&nbsp;"/>
                        </f:facet>
                        <h:commandLink action="#{entidadController.prepareView}" value="#{bundle.ListEntidadViewLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{entidadController.prepareEdit}" value="#{bundle.ListEntidadEditLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{entidadController.destroy}" value="#{bundle.ListEntidadDestroyLink}"/>
                    </p:column>
                </p:dataTable>
                <br />
                <h:commandLink action="#{entidadController.prepareCreate}" value="#{bundle.ListEntidadCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListEntidadIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
