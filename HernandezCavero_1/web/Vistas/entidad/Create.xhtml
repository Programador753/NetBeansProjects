<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="Nueva Entidad Financiadora"/>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <p:panel header="Datos de la Entidad">
                    <h:panelGrid columns="2" cellpadding="10" style="width:100%;">
                        
                        <p:outputLabel value="Nombre Entidad: *"/>
                        <p:inputText value="#{entidadController.selected.nomEntidad}" 
                                     required="true" size="60" style="width:400px;"/>
                        
                        <p:outputLabel value="Tipo Entidad:"/>
                        <h:selectOneMenu value="#{entidadController.selected.tipoEntidad}">
                            <f:selectItem itemLabel="-- Seleccione Tipo --" itemValue=""/>
                            <f:selectItems value="#{tipoentidadController.itemsAvailableSelectOne}"/>
                        </h:selectOneMenu>
                        
                    </h:panelGrid>
                </p:panel>
                
                <br/>
                <h:panelGroup style="display:flex; gap:10px;">
                    <p:commandButton value="Guardar" action="#{entidadController.create}" 
                                     icon="pi pi-save" styleClass="ui-button-success"/>
                    <p:commandButton value="Volver al Listado" action="#{entidadController.prepareList}" 
                                     icon="pi pi-arrow-left" styleClass="ui-button-secondary" immediate="true"/>
                </h:panelGroup>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
