<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListMisioneroTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <p:dataTable value="#{misioneroController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">

                    <p:column headerText="#{bundle.ListMisioneroTitle_codMisionero}" sortBy="#{item.codMisionero}" filterBy="#{item.codMisionero}" filterMatchMode="contains">
                        <h:outputText value="#{item.codMisionero}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListMisioneroTitle_nomMisionero}" sortBy="#{item.nomMisionero}" filterBy="#{item.nomMisionero}" filterMatchMode="contains">
                        <h:outputText value="#{item.nomMisionero}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListMisioneroTitle_tipoMisionero}" sortBy="#{item.tipoMisionero}" filterBy="#{item.tipoMisionero}" filterMatchMode="contains">
                        <h:outputText value="#{item.tipoMisionero}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListMisioneroTitle_mail1}">
                        <h:outputText value="#{item.mail1}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListMisioneroTitle_mail2}">
                        <h:outputText value="#{item.mail2}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListMisioneroTitle_telefono}">
                        <h:outputText value="#{item.telefono}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListMisioneroTitle_codMision}">
                        <h:outputText value="#{item.codMision}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="&nbsp;"/>
                        </f:facet>
                        <h:commandLink action="#{misioneroController.prepareView}" value="#{bundle.ListMisioneroViewLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{misioneroController.prepareEdit}" value="#{bundle.ListMisioneroEditLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{misioneroController.destroy}" value="#{bundle.ListMisioneroDestroyLink}"/>
                    </p:column>
                </p:dataTable>
                <br />
                <h:commandLink action="#{misioneroController.prepareCreate}" value="#{bundle.ListMisioneroCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListMisioneroIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
