<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditPaisTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <p:panelGrid columns="2">
                    <p:outputLabel value="#{bundle.EditPaisLabel_codigo}" for="codigo" />
                    <p:inputText id="codigo" value="#{paisController.selected.codigo}" title="#{bundle.EditPaisTitle_codigo}" required="true" requiredMessage="#{bundle.EditPaisRequiredMessage_codigo}" disabled="true"/>
                    <p:outputLabel value="#{bundle.EditPaisLabel_codPais}" for="codPais" />
                    <p:inputText id="codPais" value="#{paisController.selected.codPais}" title="#{bundle.EditPaisTitle_codPais}" />
                    <p:outputLabel value="#{bundle.EditPaisLabel_codPaisTelefono}" for="codPaisTelefono" />
                    <p:inputText id="codPaisTelefono" value="#{paisController.selected.codPaisTelefono}" title="#{bundle.EditPaisTitle_codPaisTelefono}" />
                    <p:outputLabel value="#{bundle.EditPaisLabel_nomPais}" for="nomPais" />
                    <p:inputText id="nomPais" value="#{paisController.selected.nomPais}" title="#{bundle.EditPaisTitle_nomPais}" required="true" requiredMessage="#{bundle.EditPaisRequiredMessage_nomPais}"/>
                    <p:outputLabel value="#{bundle.EditPaisLabel_nomPaisIngles}" for="nomPaisIngles" />
                    <p:inputText id="nomPaisIngles" value="#{paisController.selected.nomPaisIngles}" title="#{bundle.EditPaisTitle_nomPaisIngles}" />
                    <p:outputLabel value="#{bundle.EditPaisLabel_subContinente}" for="subContinente" />
                    <p:inputText id="subContinente" value="#{paisController.selected.subContinente}" title="#{bundle.EditPaisTitle_subContinente}" />
                    <p:outputLabel value="#{bundle.EditPaisLabel_codRegion}" for="codRegion" />
                    <p:inputText id="codRegion" value="#{paisController.selected.codRegion}" title="#{bundle.EditPaisTitle_codRegion}" />
                </p:panelGrid>
                <p:commandLink action="#{paisController.update}" value="#{bundle.EditPaisSaveLink}"/>
                <br />
                <br />
                <p:link outcome="View" value="#{bundle.EditPaisViewLink}"/>
                <br />
                <p:commandLink action="#{paisController.prepareList}" value="#{bundle.EditPaisShowAllLink}" immediate="true"/>
                <br />
                <br />
                <p:link outcome="/index" value="#{bundle.EditPaisIndexLink}" />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
