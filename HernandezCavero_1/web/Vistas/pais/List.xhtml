<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListPaisTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <p:dataTable value="#{paisController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">

                    <p:column headerText="#{bundle.ListPaisTitle_codigo}" sortBy="#{item.codigo}" filterBy="#{item.codigo}" filterMatchMode="contains">
                        <h:outputText value="#{item.codigo}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListPaisTitle_codPais}" sortBy="#{item.codPais}" filterBy="#{item.codPais}" filterMatchMode="contains">
                        <h:outputText value="#{item.codPais}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListPaisTitle_codPaisTelefono}" sortBy="#{item.codPaisTelefono}" filterBy="#{item.codPaisTelefono}" filterMatchMode="contains">
                        <h:outputText value="#{item.codPaisTelefono}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListPaisTitle_nomPais}" sortBy="#{item.nomPais}" filterBy="#{item.nomPais}" filterMatchMode="contains">
                        <h:outputText value="#{item.nomPais}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListPaisTitle_nomPaisIngles}" sortBy="#{item.nomPaisIngles}" filterBy="#{item.nomPaisIngles}" filterMatchMode="contains">
                        <h:outputText value="#{item.nomPaisIngles}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListPaisTitle_subContinente}">
                        <h:outputText value="#{item.subContinente}"/>
                    </p:column>

                    <p:column headerText="#{bundle.ListPaisTitle_codRegion}">
                        <h:outputText value="#{item.codRegion}"/>
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="&nbsp;"/>
                        </f:facet>
                        <h:commandLink action="#{paisController.prepareView}" value="#{bundle.ListPaisViewLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{paisController.prepareEdit}" value="#{bundle.ListPaisEditLink}"/>
                        <h:outputText value=" "/>
                        <h:commandLink action="#{paisController.destroy}" value="#{bundle.ListPaisDestroyLink}"/>
                    </p:column>
                </p:dataTable>
                <br />
                <h:commandLink action="#{paisController.prepareCreate}" value="#{bundle.ListPaisCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListPaisIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
