<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditCategoriaTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <p:panelGrid columns="2">
                    <p:outputLabel value="#{bundle.EditCategoriaLabel_codCategoria}" for="codCategoria" />
                    <p:inputText id="codCategoria" value="#{categoriaController.selected.codCategoria}" title="#{bundle.EditCategoriaTitle_codCategoria}" disabled="true"/>
                    <p:outputLabel value="#{bundle.EditCategoriaLabel_nomCategoria}" for="nomCategoria" />
                    <p:inputText id="nomCategoria" value="#{categoriaController.selected.nomCategoria}" title="#{bundle.EditCategoriaTitle_nomCategoria}" />
                </p:panelGrid>
                <p:commandLink action="#{categoriaController.update}" value="#{bundle.EditCategoriaSaveLink}"/>
                <br />
                <br />
                <p:link outcome="View" value="#{bundle.EditCategoriaViewLink}"/>
                <br />
                <p:commandLink action="#{categoriaController.prepareList}" value="#{bundle.EditCategoriaShowAllLink}" immediate="true"/>
                <br />
                <br />
                <p:link outcome="/index" value="#{bundle.EditCategoriaIndexLink}" />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
