<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Editar Usuario: #{usuarioController.selected.nomUsuario}</ui:define>
        <ui:define name="body">
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            <h:form>
                <p:panel header=" Datos del Usuario">
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Código:"/>
                        <p:inputText value="#{usuarioController.selected.codUsuario}" disabled="true"/>
                        <p:outputLabel value="Nombre Usuario: *"/>
                        <p:inputText value="#{usuarioController.selected.nomUsuario}" required="true" size="30"/>
                        <p:outputLabel value="Email: *"/>
                        <p:inputText value="#{usuarioController.selected.email}" required="true" size="50"/>
                        <p:outputLabel value="Contraseña:"/>
                        <p:password value="#{usuarioController.selected.password}" size="30"/>
                        <p:outputLabel value="Rol:"/>
                        <p:selectOneMenu value="#{usuarioController.selected.rol}">
                            <f:selectItem itemLabel="-- Seleccione Rol --" itemValue=""/>
                            <f:selectItem itemLabel="Administrador" itemValue="ADMIN"/>
                            <f:selectItem itemLabel="Usuario" itemValue="USER"/>
                            <f:selectItem itemLabel="Técnico" itemValue="TECNICO"/>
                            <f:selectItem itemLabel="Visualizador" itemValue="VIEWER"/>
                        </p:selectOneMenu>
                        <p:outputLabel value="¿Activo?:"/>
                        <p:selectBooleanCheckbox value="#{usuarioController.selected.activo}"/>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Guardar" action="#{usuarioController.update}" icon="pi pi-save"/>
                <p:commandButton value=" Volver" action="#{usuarioController.prepareList}" immediate="true"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
