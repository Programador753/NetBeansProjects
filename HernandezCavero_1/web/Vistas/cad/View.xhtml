<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Detalle CAD #{cadController.selected.codCad}</ui:define>
        <ui:define name="body">
            <h:form>
                <p:panel header="📈 Clasificación CAD">
                    <h:panelGrid columns="2" cellpadding="10">
                        <h:outputText value="Código CAD:" style="font-weight:bold;"/>
                        <h:outputText value="#{cadController.selected.codCad}" style="font-size:1.3em; color:#1a237e;"/>
                        <h:outputText value="Nombre (Español):" style="font-weight:bold;"/>
                        <h:outputText value="#{cadController.selected.nomCad}"/>
                        <h:outputText value="Nombre (Inglés):" style="font-weight:bold;"/>
                        <h:outputText value="#{cadController.selected.nomCadIngles}"/>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Editar" action="#{cadController.prepareEdit}" icon="pi pi-pencil"/>
                <p:commandButton value=" Eliminar" action="#{cadController.destroy}" onclick="return confirm('¿Eliminar?');"/>
                <p:commandButton value=" Volver" action="#{cadController.prepareList}"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
