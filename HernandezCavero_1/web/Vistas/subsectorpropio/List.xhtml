<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListSubsectorpropioTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                    <p:dataTable value="#{subsectorpropioController.items}"
                            var="item"
                            rows="10"
                            style="border:solid 1px"
                            paginator="true"
                            paginatorPosition="both"
                            paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                            currentPageReportTemplate="{startRecord}-{endRecord} of {totalRecords} records"
                            rowsPerPageTemplate="5,10,20,{ShowAll|'All'}" reflow="true" stripedRows="true">
                        <p:column headerText="#{bundle.ListSubsectorpropioTitle_codSubsector}"><h:outputText value="#{item.codSubsector}"/>
                        </p:column>
                        <p:column headerText="#{bundle.ListSubsectorpropioTitle_nomSubsector}"><h:outputText value="#{item.nomSubsector}"/>
                        </p:column>
                        <p:column headerText="#{bundle.ListSubsectorpropioTitle_codSector}"><h:outputText value="#{item.codSector}"/>
                        </p:column>
                        <p:column><h:commandLink action="#{subsectorpropioController.prepareView}" value="#{bundle.ListSubsectorpropioViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{subsectorpropioController.prepareEdit}" value="#{bundle.ListSubsectorpropioEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{subsectorpropioController.destroy}" value="#{bundle.ListSubsectorpropioDestroyLink}"/>
                        </p:column>
                    </p:dataTable>
                <br />
                <h:commandLink action="#{subsectorpropioController.prepareCreate}" value="#{bundle.ListSubsectorpropioCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListSubsectorpropioIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
