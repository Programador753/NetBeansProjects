<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Nuevo Subsector Propio</ui:define>
        <ui:define name="body">
            <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            <h:form>
                <p:panel header=" Subsector Propio">
                    <h:panelGrid columns="2" cellpadding="10">
                        <p:outputLabel value="Código: *" for="codSubsectorPropio"/>
                        <p:inputText id="codSubsectorPropio" value="#{subsectorpropioController.selected.codSubsectorPropio}" required="true" size="5"/>
                        <p:outputLabel value="Nombre: *" for="nomSubsectorPropio"/>
                        <p:inputText id="nomSubsectorPropio" value="#{subsectorpropioController.selected.nomSubsectorPropio}" required="true" size="50"/>
                        <p:outputLabel value="Sector Propio Padre:" for="sectorPropio"/>
                        <h:selectOneMenu id="sectorPropio" value="#{subsectorpropioController.selected.sectorPropio}">
                            <f:selectItem itemLabel="-- Seleccione --" itemValue=""/>
                            <f:selectItems value="#{sectorpropioController.itemsAvailableSelectOne}"/>
                        </h:selectOneMenu>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Guardar" action="#{subsectorpropioController.create}" icon="pi pi-save"/>
                <p:commandButton value=" Volver" action="#{subsectorpropioController.prepareList}" immediate="true"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
