<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title"> Detalle Subsector Propio</ui:define>
        <ui:define name="body">
            <h:form>
                <p:panel header=" Subsector Propio">
                    <h:panelGrid columns="2" cellpadding="10">
                        <h:outputText value="Código:" style="font-weight:bold;"/>
                        <h:outputText value="#{subsectorpropioController.selected.codSubsectorPropio}" style="font-size:1.3em; color:#1a237e;"/>
                        <h:outputText value="Nombre:" style="font-weight:bold;"/>
                        <h:outputText value="#{subsectorpropioController.selected.nomSubsectorPropio}"/>
                        <h:outputText value="Sector Propio Padre:" style="font-weight:bold;"/>
                        <h:outputText value="#{subsectorpropioController.selected.sectorPropio.nomSectorPropio}" rendered="#{subsectorpropioController.selected.sectorPropio ne null}"/>
                    </h:panelGrid>
                </p:panel>
                <br/>
                <p:commandButton value=" Editar" action="#{subsectorpropioController.prepareEdit}" icon="pi pi-pencil"/>
                <p:commandButton value=" Eliminar" action="#{subsectorpropioController.destroy}" onclick="return confirm('¿Eliminar?');"/>
                <p:commandButton value=" Volver" action="#{subsectorpropioController.prepareList}"/>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
