<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <title><ui:insert name="title">Sistema de Gestion de Misiones</ui:insert></title>
        <h:outputStylesheet library="css" name="jsfcrud.css"/>
    </h:head>

    <h:body>
        <!-- Menu Principal -->
        <h:form>
            <p:menubar>
                <p:menuitem value="Inicio" outcome="/index" icon="pi pi-home"/>
                
                <p:submenu label="Proyectos" icon="pi pi-folder">
                    <p:menuitem value="Listado" outcome="/Vistas/proyecto/List" icon="pi pi-list"/>
                    <p:menuitem value="Nuevo Proyecto" outcome="/Vistas/proyecto/Create" icon="pi pi-plus"/>
                    <p:separator/>
                    <p:menuitem value="Por Inspectoria" outcome="/Vistas/proyecto/List" icon="pi pi-filter"/>
                    <p:menuitem value="Por Pais" outcome="/Vistas/proyecto/List" icon="pi pi-globe"/>
                    <p:menuitem value="Por Anyo" outcome="/Vistas/proyecto/List" icon="pi pi-calendar"/>
                </p:submenu>
                
                <p:submenu label="Organizacion" icon="pi pi-sitemap">
                    <p:menuitem value="Inspectorias" outcome="/Vistas/inspectoria/List" icon="pi pi-building"/>
                    <p:menuitem value="Misiones" outcome="/Vistas/mision/List" icon="pi pi-home"/>
                    <p:menuitem value="Sedes" outcome="/Vistas/sede/List" icon="pi pi-map-marker"/>
                    <p:menuitem value="Misioneros" outcome="/Vistas/misionero/List" icon="pi pi-users"/>
                </p:submenu>
                
                <p:submenu label="Financiacion" icon="pi pi-dollar">
                    <p:menuitem value="Entidades" outcome="/Vistas/entidad/List" icon="pi pi-briefcase"/>
                    <p:menuitem value="Tipos Entidad" outcome="/Vistas/tipoentidad/List" icon="pi pi-tags"/>
                    <p:menuitem value="Envios" outcome="/Vistas/envio/List" icon="pi pi-send"/>
                </p:submenu>
                
                <p:submenu label="Clasificacion" icon="pi pi-th-large">
                    <p:menuitem value="Sectores" outcome="/Vistas/sector/List" icon="pi pi-chart-pie"/>
                    <p:menuitem value="Subsectores" outcome="/Vistas/subsector/List" icon="pi pi-chart-bar"/>
                    <p:menuitem value="CAD" outcome="/Vistas/cad/List" icon="pi pi-bookmark"/>
                    <p:menuitem value="CRS" outcome="/Vistas/crs/List" icon="pi pi-code"/>
                    <p:menuitem value="ODS" outcome="/Vistas/odsprincipal/List" icon="pi pi-globe"/>
                </p:submenu>
                
                <p:submenu label="Personal" icon="pi pi-user">
                    <p:menuitem value="Tecnicos" outcome="/Vistas/tecnico/List" icon="pi pi-id-card"/>
                    <p:menuitem value="Responsables" outcome="/Vistas/responsable/List" icon="pi pi-user-edit"/>
                </p:submenu>
                
                <p:submenu label="Geografia" icon="pi pi-map">
                    <p:menuitem value="Paises" outcome="/Vistas/pais/List" icon="pi pi-flag"/>
                    <p:menuitem value="Continentes" outcome="/Vistas/continente/List" icon="pi pi-globe"/>
                    <p:menuitem value="Regiones" outcome="/Vistas/region/List" icon="pi pi-compass"/>
                </p:submenu>
                
                <p:submenu label="Configuracion" icon="pi pi-cog">
                    <p:menuitem value="Status" outcome="/Vistas/status/List" icon="pi pi-check-circle"/>
                    <p:menuitem value="Instrumentos" outcome="/Vistas/instrumento/List" icon="pi pi-wrench"/>
                    <p:menuitem value="Tipos Proyecto" outcome="/Vistas/tipoproyecto/List" icon="pi pi-folder"/>
                    <p:menuitem value="Categorias" outcome="/Vistas/categoria/List" icon="pi pi-folder-open"/>
                </p:submenu>
            </p:menubar>
        </h:form>
        
        <div class="content-wrapper">
            <h1 class="page-title">
                <ui:insert name="title">Sistema de Gestion de Misiones</ui:insert>
            </h1>
            <div class="page-content">
                <ui:insert name="body">Contenido por defecto</ui:insert>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <p>Sistema de Gestion de Misiones y Proyectos - Misiones Salesianas 2024</p>
        </div>
    </h:body>

</html>
