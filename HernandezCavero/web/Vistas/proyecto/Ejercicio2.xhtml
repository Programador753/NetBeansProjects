<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="Inserción de Proyecto"/>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <p:panelGrid columns="2">
                    <p:outputLabel value="Año: *" for="inputAnyo"/>
                    <p:inputText id="inputAnyo" 
                                value="#{proyectoController.anyoNuevo}"
                                required="true" 
                                requiredMessage="El año es obligatorio"/>
                    
                    <p:outputLabel value="Instrumento: *" for="selectInstrumento"/>
                    <p:selectOneMenu id="selectInstrumento" 
                                    value="#{proyectoController.instrumentoNuevo}"
                                    converter="instrumentoConverter">
                        <f:selectItems value="#{proyectoController.instrumentosSelectItems}"/>
                    </p:selectOneMenu>
                    
                    <p:outputLabel value="País: *" for="selectPais"/>
                    <p:selectOneMenu id="selectPais" 
                                    value="#{proyectoController.paisNuevo}"
                                    converter="paisConverter">
                        <f:selectItems value="#{proyectoController.paisesSelectItems}"/>
                    </p:selectOneMenu>
                    
                    <p:outputLabel value="ODS:" for="selectOds"/>
                    <p:selectManyMenu id="selectOds" 
                                     value="#{proyectoController.odsSeleccionados}"
                                     converter="odsprincipalConverter">
                        <f:selectItems value="#{proyectoController.odsSelectItems}"/>
                    </p:selectManyMenu>
                    
                    <p:outputLabel value="CRS:" for="selectCrs"/>
                    <p:selectManyMenu id="selectCrs" 
                                     value="#{proyectoController.crsSeleccionados}"
                                     converter="crsConverter">
                        <f:selectItems value="#{proyectoController.crsSelectItems}"/>
                    </p:selectManyMenu>
                    
                </p:panelGrid>
                <br />
                <h:commandLink action="#{proyectoController.insertarProyecto}" value="Guardar Proyecto"/>
                <br />
                <br />
                <h:link outcome="/index" value="Volver al Inicio"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
