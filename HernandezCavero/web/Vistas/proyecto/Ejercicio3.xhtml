<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="Listado de Proyectos"/>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <p:dataTable value="#{proyectoController.todosLosProyectos}" 
                             var="proyecto" 
                             rows="10"
                             paginator="true" 
                             paginatorPosition="both"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
                             currentPageReportTemplate="{startRecord}-{endRecord} de {totalRecords}"
                             rowsPerPageTemplate="5,10,25,50"
                             emptyMessage="No se encontraron proyectos.">
                    
                    <p:column headerText="Código" sortBy="#{proyecto.codigo}">
                        <h:outputText value="#{proyecto.codigo}"/>
                    </p:column>
                    
                    <p:column headerText="Nombre" sortBy="#{proyecto.titulo}">
                        <h:outputText value="#{proyecto.titulo}"/>
                    </p:column>
                    
                    <p:column headerText="Año" sortBy="#{proyecto.anyo}">
                        <h:outputText value="#{proyecto.anyo}"/>
                    </p:column>
                    
                    <p:column headerText="CAD">
                        <h:outputText value="#{proyecto.sectorCAD} - #{proyectoController.getNombreCAD(proyecto.sectorCAD)}" 
                                      rendered="#{proyecto.sectorCAD != null}"/>
                        <h:outputText value="-" rendered="#{proyecto.sectorCAD == null}"/>
                    </p:column>
                    
                    <p:column headerText="CRS">
                        <ui:repeat value="#{proyecto.crsList}" var="crs" varStatus="status">
                            <h:outputText value="#{crs.codCrs} - #{crs.nomCrs}"/>
                            <h:outputText value=", " rendered="#{!status.last}"/>
                        </ui:repeat>
                        <h:outputText value="-" rendered="#{empty proyecto.crsList}"/>
                    </p:column>
                    
                    <p:column headerText="ODS">
                        <ui:repeat value="#{proyecto.odsprincipalList}" var="ods" varStatus="status">
                            <h:outputText value="#{ods.codOds} - #{ods.nomOds}"/>
                            <h:outputText value=", " rendered="#{!status.last}"/>
                        </ui:repeat>
                        <h:outputText value="-" rendered="#{empty proyecto.odsprincipalList}"/>
                    </p:column>
                    
                </p:dataTable>
                <br />
                <h:link outcome="/index" value="Volver al Inicio"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
